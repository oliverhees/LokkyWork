<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .d{transform-origin:50% 90%;animation:a 1.2s ease-in-out infinite}
    @keyframes a{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
  </style>
  <image class="d" href="done.png" x="0" y="0" width="100" height="100"/>
</svg>
