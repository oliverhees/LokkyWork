<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .d{transform-box:fill-box;transform-origin:50% 88%;animation:a 1.1s ease-in-out infinite}
    @keyframes a{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.03,.97)}}
  </style>
  <image class="d" href="happy.png" x="0" y="0" width="100" height="100"/>
</svg>
