# nginx-Konfiguration für die statisch gebaute LokkyWork-Hilfe (Astro/Starlight).
# Astro legt Seiten als <seite>/index.html ab; try_files findet sie sauber.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip für schnellere Auslieferung der HTML/JS/CSS-Dateien
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Eigene 404-Seite von Starlight
    error_page 404 /404.html;
}
